<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NDIL Social 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151e33;--line:#2a3856;--muted:#a2afca;--accent:#8878ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6ff;font:15px system-ui,Arial}.wrap{max-width:780px;margin:auto;padding:16px}.top,.row,.tabs,.profilehead,.posthead,.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.logo{font-size:25px;font-weight:900}.logo span{color:var(--accent)}.card,.post{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}button{border:0;border-radius:11px;background:var(--accent);color:white;padding:10px 13px;font-weight:700;cursor:pointer}.alt{background:#202c48;border:1px solid var(--line)}.red{background:#633044}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#0e1729;color:white;margin:6px 0 12px}textarea{min-height:75px}.row>*{flex:1}.tabs button{flex:1}.muted{color:var(--muted);font-size:13px}.hide{display:none!important}.notice{padding:11px;border-radius:11px;background:#272245;margin:12px 0}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#293653;display:grid;place-items:center;flex-shrink:0}.posthead{justify-content:space-between}.person{display:flex;gap:10px;align-items:center;flex:1;min-width:150px}.media{width:100%;max-height:480px;object-fit:contain;border-radius:12px;margin-top:10px;background:#070b14}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions button{padding:8px 11px}.stats{gap:22px;margin:14px 0}.stats b{display:block;font-size:20px}.user{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.user:last-child{border:0}.user .info{flex:1}.comment{border-top:1px solid var(--line);padding:8px 0}.footer{text-align:center;color:var(--muted);padding:24px;font-size:12px}
</style></head>
<body><div class="wrap">
<header class="top"><div class="logo">NDIL <span>Social</span> <small class="muted">2.0</small></div><span id="currentUser" class="muted"></span></header>
<div id="status" class="notice">Bağlantı kuruluyor…</div>
<section id="auth" class="card"><h2>NDIL Social'a giriş</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre (en az 6 karakter)"><div class="row"><button id="login">Giriş yap</button><button id="signup" class="alt">Hesap oluştur</button></div></section>
<main id="app" class="hide">
<nav class="tabs"><button data-view="feed">Akış</button><button data-view="search" class="alt">Keşfet</button><button data-view="profile" class="alt">Profilim</button><button id="logout" class="alt">Çıkış</button></nav>
<section id="feedView"><div class="card"><h3>Yeni gönderi</h3><textarea id="caption" placeholder="Neler oluyor?"></textarea><input id="photo" type="file" accept="image/*"><button id="share">Paylaş</button></div><div class="row"><button id="allPosts">Tüm gönderiler</button><button id="followingPosts" class="alt">Takip ettiklerim</button></div><div id="feed"></div></section>
<section id="searchView" class="hide"><div class="card"><h3>Kullanıcı ara</h3><input id="search" placeholder="Kullanıcı adı (en az 2 karakter)"><div id="results"></div></div></section>
<section id="profileView" class="hide"><div id="myProfile" class="card"></div><div class="card"><h3>Profili düzenle</h3><input id="username" placeholder="Kullanıcı adı (3-20 karakter)"><textarea id="bio" placeholder="Biyografi"></textarea><input id="avatarUrl" placeholder="Profil fotoğrafı URL'si (isteğe bağlı)"><button id="saveProfile">Kaydet</button></div></section>
<section id="otherView" class="hide"><button id="back" class="alt">← Geri</button><div id="otherProfile" class="card"></div><div id="otherPosts"></div></section>
</main><div class="footer">NDIL Social 2.0 · Mobil sosyal alan</div></div>
<script>
(() => {
const URL="https://vhfrnuspuuxixmdpajsf.supabase.co";
const KEY="sb_publishable_rev-T5Qfo_1Kflk6PaOQLg_j9n-2RWP";
const $=id=>document.getElementById(id), say=(s,err=false)=>{$("status").textContent=s;$("status").style.color=err?"#ff8797":"#fff"};
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sup,session,me,view="feed",feedMode="all",otherId,searchWait;
const avatar=(url,name)=>url?`<img class="avatar" src="${safe(url)}" alt="">`:`<div class="avatar">${safe((name||"?").slice(0,1).toUpperCase())}</div>`;
const error=e=>{console.error(e);say(e?.message||"İşlem başarısız oldu.",true)};
async function getMe(){
 const {data,error:e}=await sup.from("profiles").select("*").eq("id",session.user.id).maybeSingle();if(e)throw e;
 if(data){me=data;return}
 let base=(session.user.email||"ndil").split("@")[0].replace(/[^a-zA-Z0-9_]/g,"").slice(0,15)||"ndil";
 const {data:d,error}=await sup.from("profiles").insert({id:session.user.id,username:base+"_"+session.user.id.slice(0,5),bio:""}).select().single();if(error)throw error;me=d;
}
async function enter(){ $("auth").classList.add("hide");$("app").classList.remove("hide");$("currentUser").textContent="@"+me.username;await refreshFeed();await renderMine();say("Giriş başarılı. NDIL Social hazır!")}
function show(viewName){view=viewName;["feedView","searchView","profileView","otherView"].forEach(x=>$(x).classList.add("hide"));$(viewName==="feed"?"feedView":viewName==="search"?"searchView":viewName==="profile"?"profileView":"otherView").classList.remove("hide")}
async function refreshFeed(){
 const box=$("feed");box.innerHTML='<p class="muted">Akış yükleniyor…</p>';
 try{
  let q=sup.from("posts").select("id,user_id,caption,image_url,created_at,profiles(username,avatar_url),likes(user_id),comments(id)").order("created_at",{ascending:false}).limit(50);
  if(feedMode==="following"){const {data:f,error}=await sup.from("follows").select("following_id").eq("follower_id",session.user.id);if(error)throw error;const ids=(f||[]).map(x=>x.following_id);if(!ids.length){box.innerHTML='<p class="muted">Henüz takip ettiğin kimse yok. Keşfet bölümünden kullanıcı bul!</p>';return}q=q.in("user_id",ids)}
  const {data,error:e}=await q;if(e)throw e;if(!data?.length){box.innerHTML='<p class="muted">Henüz gönderi yok. İlk paylaşımı sen yap!</p>';return}
  box.innerHTML=data.map(p=>{let profile=Array.isArray(p.profiles)?p.profiles[0]:p.profiles;let liked=(p.likes||[]).some(x=>x.user_id===session.user.id);return `<article class="post"><div class="posthead"><div class="person">${avatar(profile?.avatar_url,profile?.username)}<div><b>@${safe(profile?.username||"üye")}</b><div class="muted">${new Date(p.created_at).toLocaleString("tr-TR")}</div></div></div><button class="alt" data-open="${p.user_id}">Profil</button></div><p>${safe(p.caption)}</p>${p.image_url?`<img class="media" src="${safe(p.image_url)}" alt="Gönderi fotoğrafı">`:""}<div class="actions"><button class="${liked?"":"alt"}" data-like="${p.id}">${liked?"♥ Beğendin":"♡ Beğen"} · ${(p.likes||[]).length}</button><span class="muted">💬 ${(p.comments||[]).length} yorum</span>${p.user_id===session.user.id?`<button class="red" data-delete="${p.id}">Sil</button>`:""}</div><div class="row"><input data-commentbox="${p.id}" placeholder="Yorum yaz…"><button data-comment="${p.id}">Yorumla</button></div></article>`}).join("");
 }catch(e){error(e);box.innerHTML='<p class="muted">Akış alınamadı. Kurulum SQL dosyasını çalıştırdığını kontrol et.</p>'}
}
async function counts(id){const [a,b,c]=await Promise.all([sup.from("follows").select("*",{count:"exact",head:true}).eq("following_id",id),sup.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",id),sup.from("posts").select("*",{count:"exact",head:true}).eq("user_id",id)]);if(a.error||b.error||c.error)throw a.error||b.error||c.error;return {followers:a.count||0,following:b.count||0,posts:c.count||0}}
function stats(x){return `<div class="stats"><div><b>${x.posts}</b><span class="muted">Gönderi</span></div><div><b>${x.followers}</b><span class="muted">Takipçi</span></div><div><b>${x.following}</b><span class="muted">Takip</span></div></div>`}
async function renderMine(){const c=await counts(session.user.id);$("myProfile").innerHTML=`<div class="person">${avatar(me.avatar_url,me.username)}<div><h2>@${safe(me.username)}</h2><span class="muted">Benim profilim</span></div></div><p>${safe(me.bio||"Biyografi eklemedin.")}</p>${stats(c)}`;$("username").value=me.username||"";$("bio").value=me.bio||"";$("avatarUrl").value=me.avatar_url||""}
async function openProfile(id){otherId=id;show("other");$("otherProfile").textContent="Profil yükleniyor…";$("otherPosts").innerHTML="";try{
 const {data:p,error:e}=await sup.from("profiles").select("*").eq("id",id).single();if(e)throw e;const c=await counts(id);let following=false;
 if(id!==session.user.id){const {data:f,error}=await sup.from("follows").select("follower_id").eq("follower_id",session.user.id).eq("following_id",id).maybeSingle();if(error)throw error;following=!!f}
 $("otherProfile").innerHTML=`<div class="person">${avatar(p.avatar_url,p.username)}<div><h2>@${safe(p.username)}</h2><span class="muted">NDIL Social üyesi</span></div></div><p>${safe(p.bio||"Biyografi yok.")}</p>${stats(c)}${id===session.user.id?'<span class="muted">Bu senin profilin.</span>':`<button id="follow">${following?"Takibi bırak":"Takip et"}</button>`}`;
 if(id!==session.user.id)$("follow").onclick=async()=>{try{if(following){const {error}=await sup.from("follows").delete().eq("follower_id",session.user.id).eq("following_id",id);if(error)throw error}else{const {error}=await sup.from("follows").insert({follower_id:session.user.id,following_id:id});if(error)throw error}say(following?"Takipten çıktın.":"Kullanıcı takip edildi.");await openProfile(id)}catch(e){error(e)}};
 const {data:posts,error}=await sup.from("posts").select("id,caption,image_url,created_at,likes(user_id),comments(id)").eq("user_id",id).order("created_at",{ascending:false});if(error)throw error;
 $("otherPosts").innerHTML=(posts||[]).map(p=>`<article class="post"><div class="muted">${new Date(p.created_at).toLocaleString("tr-TR")}</div><p>${safe(p.caption)}</p>${p.image_url?`<img class="media" src="${safe(p.image_url)}" alt="">`:""}<span class="muted">♥ ${(p.likes||[]).length} · 💬 ${(p.comments||[]).length}</span></article>`).join("")||'<p class="muted">Gönderi bulunamadı.</p>';
 }catch(e){error(e);$("otherProfile").textContent="Profil yüklenemedi."}}
async function doSearch(){let term=$("search").value.trim();if(term.length<2){$("results").innerHTML='<span class="muted">En az 2 karakter yaz.</span>';return}try{const {data,error:e}=await sup.from("profiles").select("id,username,bio,avatar_url").ilike("username","%"+term.replace(/[%_]/g,"")+"%").limit(25);if(e)throw e;$("results").innerHTML=data.length?data.map(p=>`<div class="user">${avatar(p.avatar_url,p.username)}<div class="info"><b>@${safe(p.username)}</b><div class="muted">${safe(p.bio||"")}</div></div><button data-open="${p.id}">Profil</button></div>`).join(""):"Kullanıcı bulunamadı."}catch(e){error(e)}}
$("login").onclick=async()=>{try{const {data,error:e}=await sup.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(e)throw e;session=data.session;await getMe();await enter()}catch(e){error(e)}};
$("signup").onclick=async()=>{try{const {data,error:e}=await sup.auth.signUp({email:$("email").value.trim(),password:$("password").value});if(e)throw e;if(data.session){session=data.session;await getMe();await enter()}else say("Hesap açıldı. E-postanı doğrula ve giriş yap.")}catch(e){error(e)}};
$("logout").onclick=async()=>{await sup.auth.signOut();session=null;$("app").classList.add("hide");$("auth").classList.remove("hide");say("Çıkış yapıldı.")};
$("share").onclick=async()=>{try{let caption=$("caption").value.trim(),file=$("photo").files[0],image_url=null;if(!caption&&!file)throw Error("Yazı veya fotoğraf ekle.");if(file){if(file.size>5*1024*1024)throw Error("Fotoğraf 5 MB'dan küçük olmalı.");if(!file.type.startsWith("image/"))throw Error("Lütfen fotoğraf dosyası seç.");let path=session.user.id+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const {error:e}=await sup.storage.from("ndil-media").upload(path,file);if(e)throw e;image_url=sup.storage.from("ndil-media").getPublicUrl(path).data.publicUrl}const {error:e}=await sup.from("posts").insert({user_id:session.user.id,caption,image_url});if(e)throw e;$("caption").value="";$("photo").value="";say("Gönderi paylaşıldı!");feedMode="all";await refreshFeed();await renderMine()}catch(e){error(e)}};
$("saveProfile").onclick=async()=>{try{let username=$("username").value.trim();if(!/^[a-zA-Z0-9_]{3,20}$/.test(username))throw Error("Kullanıcı adı 3-20 karakter olmalı (harf, sayı, _).");const {data,error:e}=await sup.from("profiles").update({username,bio:$("bio").value.trim(),avatar_url:$("avatarUrl").value.trim()||null}).eq("id",session.user.id).select().single();if(e)throw e;me=data;$("currentUser").textContent="@"+me.username;await renderMine();say("Profil güncellendi.")}catch(e){error(e)}};
$("allPosts").onclick=()=>{feedMode="all";refreshFeed()};$("followingPosts").onclick=()=>{feedMode="following";refreshFeed()};
$("search").addEventListener("input",()=>{clearTimeout(searchWait);searchWait=setTimeout(doSearch,250)});
$("back").onclick=()=>show("feed");
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{show(b.dataset.view);if(b.dataset.view==="profile")renderMine();if(b.dataset.view==="search")doSearch()});
document.addEventListener("click",async ev=>{let el=ev.target.closest("[data-open]");if(el){openProfile(el.dataset.open);return}el=ev.target.closest("[data-like]");if(el){try{let id=el.dataset.like;const {data,error:e}=await sup.from("likes").select("post_id").eq("post_id",id).eq("user_id",session.user.id).maybeSingle();if(e)throw e;if(data){const {error}=await sup.from("likes").delete().eq("post_id",id).eq("user_id",session.user.id);if(error)throw error}else{const {error}=await sup.from("likes").insert({post_id:id,user_id:session.user.id});if(error)throw error}await refreshFeed()}catch(e){error(e)}return}el=ev.target.closest("[data-delete]");if(el&&confirm("Gönderi silinsin mi?")){try{const {error}=await sup.from("posts").delete().eq("id",el.dataset.delete).eq("user_id",session.user.id);if(error)throw error;await refreshFeed();await renderMine()}catch(e){error(e)}return}el=ev.target.closest("[data-comment]");if(el){try{let id=el.dataset.comment,input=document.querySelector(`[data-commentbox="${id}"]`),body=input.value.trim();if(!body)return;const {error}=await sup.from("comments").insert({post_id:id,user_id:session.user.id,body});if(error)throw error;input.value="";say("Yorum eklendi.");await refreshFeed()}catch(e){error(e)}}});
async function init(){if(!window.supabase){say("Supabase SDK yüklenemedi. İnternetini kontrol et.",true);return}sup=window.supabase.createClient(URL,KEY);const {data,error:e}=await sup.auth.getSession();if(e)throw e;session=data.session;if(session){await getMe();await enter()}else say("Supabase bağlantısı hazır. Giriş yap veya hesap oluştur.");sup.auth.onAuthStateChange((_event,s)=>{session=s})}
init().catch(error);
})();
</script></body></html>
